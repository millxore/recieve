<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users Directory</title>
  <style>
    :root {
      --background: #0a0b14;
      --surface: #11121f;
      --surface-elevated: #181a2a;
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --accent: #f5a623;
      --accent-hover: #e09516;
      --ring: rgba(245, 166, 35, 0.4);
      --radius: 0.75rem;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 30%, #1a1d33 0%, transparent 40%),
                  radial-gradient(circle at 80% 10%, #252a45 0%, transparent 35%),
                  var(--background);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--text-secondary); margin-top: 0.5rem; }

    .controls {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      justify-content: center; margin-bottom: 1.5rem;
    }

    .controls input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.6rem 0.9rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
      outline: none;
      min-width: 280px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .controls input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }

    .stats { display: flex; gap: 1rem; justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap; }

    .stat-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .stat-pill strong { color: var(--text-primary); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
      cursor: pointer;
      outline: none;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
    }

    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(245, 166, 35, 0.35);
      background: var(--surface-elevated);
    }
    .card:focus-visible { box-shadow: 0 0 0 3px var(--ring); }

    .card-header { display: flex; align-items: center; gap: 0.875rem; }

    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, #f5a623, #d97706);
      display: grid; place-items: center;
      font-weight: 700; font-size: 1.1rem; color: #fff; flex-shrink: 0;
    }
    .avatar.lg { width: 64px; height: 64px; font-size: 1.4rem; }

    .name { font-size: 1.05rem; font-weight: 600; line-height: 1.2; }
    .email { font-size: 0.8rem; color: var(--accent); margin-top: 0.2rem; word-break: break-all; }
    .hint { font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.25rem; }

    /* ---------- Detail view ---------- */
    .detail-view {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }

    .back-btn {
      display: inline-flex; align-items: center; gap: 0.45rem;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius);
      font-size: 0.9rem; cursor: pointer;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s, background 0.2s;
    }
    .back-btn:hover { border-color: var(--accent); background: #1f2236; }
    .back-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }

    .detail-head { display: flex; align-items: center; gap: 1rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
    .detail-head .name { font-size: 1.35rem; }
    .meta { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem; }

    .section-title {
      margin: 1.5rem 0 0.75rem;
      font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-secondary);
    }

    .tx-list { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }

    .tx {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
    }
    .tx-top { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
    .tx-title { font-weight: 600; font-size: 0.98rem; }
    .tx-date { font-size: 0.78rem; color: var(--text-secondary); white-space: nowrap; }
    .tx-message { margin-top: 0.35rem; font-size: 0.88rem; color: var(--text-secondary); }

    .empty { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }

    .hidden { display: none !important; }

    @media (max-width: 640px) {
      header h1 { font-size: 1.5rem; }
      .controls input { min-width: 100%; }
      .grid { grid-template-columns: 1fr; }
      .tx-top { flex-direction: column; gap: 0.15rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Users Directory</h1>
      <p id="subtitle">Click a user to see only that user's details.</p>
    </header>

    <!-- LIST VIEW -->
    <section id="listView">
      <div class="controls">
        <input type="text" id="search" placeholder="Search by name or email..." aria-label="Search users" />
      </div>
      <div class="stats" id="stats"></div>
      <div class="grid" id="userGrid"></div>
    </section>

    <!-- DETAIL VIEW (hidden until a user is clicked) -->
    <section id="detailView" class="hidden">
      <button class="back-btn" id="backBtn" type="button">&larr; Back to all users</button>
      <div class="detail-view" id="detailContent"></div>
    </section>
  </div>

  <script>
    // =========================================================================
    // 1. DEMO DATA — savedUsers: userId, Name, Email, Transactions[]
    //    Each transaction: { title, date, message }
    // =========================================================================
    const demoUsers = [
      {
        userId: "1",
        name: "Adeola Ogunlesi",
        email: "adeola.ogunlesi@example.com",
        transactions: [
          { title: "Wallet Top-up", date: "2024-01-12", message: "Added ₦50,000 via bank transfer." },
          { title: "Subscription", date: "2024-02-01", message: "Monthly Pro plan renewed successfully." },
          { title: "Refund", date: "2024-02-18", message: "Refund issued for duplicate charge." }
        ]
      },
      //{
        //userId: "5",
        //name: "Amara Diallo",
        //email: "amara.diallo@example.com",
        //transactions: [
          //{ title: "Ad Spend", date: "2024-06-01", message: "Campaign budget charged for June." },
          //{ title: "Refund", date: "2024-06-14", message: "Partial refund for cancelled campaign." },
          //{ title: "Payout", date: "2024-06-28", message: "Affiliate payout processed." }
        //]
      //}
    ];

    const STORAGE_KEY = "savedUsers";

    // Seed localStorage on first visit so the page always has data.
    if (!localStorage.getItem(STORAGE_KEY)) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(demoUsers));
    }

    // =========================================================================
    // 2. LOAD FROM LOCALSTORAGE
    // =========================================================================
    let savedUsers = [];
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) savedUsers = JSON.parse(raw);
      if (!Array.isArray(savedUsers)) savedUsers = [];
    } catch (e) {
      console.error("Invalid data in savedUsers:", e);
      localStorage.removeItem(STORAGE_KEY);
      savedUsers = [];
    }

    // =========================================================================
    // 3. DOM REFERENCES
    // =========================================================================
    const listView = document.getElementById("listView");
    const detailView = document.getElementById("detailView");
    const detailContent = document.getElementById("detailContent");
    const grid = document.getElementById("userGrid");
    const stats = document.getElementById("stats");
    const searchInput = document.getElementById("search");
    const backBtn = document.getElementById("backBtn");
    const subtitle = document.getElementById("subtitle");

    // =========================================================================
    // 4. HELPERS
    // =========================================================================
    const escapeHtml = (value) =>
      String(value ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));

    const initials = (name) =>
      String(name || "?").trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join("").toUpperCase();

    const formatDate = (value) => {
      const d = new Date(value);
      if (isNaN(d)) return escapeHtml(value);
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    };

    const findUser = (id) => savedUsers.find((u) => String(u.userId) === String(id));

    // =========================================================================
    // 5. RENDER: LIST
    // =========================================================================
    function renderList() {
      const term = searchInput.value.trim().toLowerCase();
      const filtered = savedUsers.filter((u) =>
        !term ||
        String(u.name || "").toLowerCase().includes(term) ||
        String(u.email || "").toLowerCase().includes(term)
      );

      const totalTx = savedUsers.reduce((sum, u) => sum + (u.transactions?.length || 0), 0);
      stats.innerHTML = `
        <span class="stat-pill">Users <strong>${savedUsers.length}</strong></span>
        <span class="stat-pill">Showing <strong>${filtered.length}</strong></span>
        <span class="stat-pill">Transactions <strong>${totalTx}</strong></span>
      `;

      if (!filtered.length) {
        grid.innerHTML = `<div class="empty">No users found.</div>`;
        return;
      }

      grid.innerHTML = filtered.map((u) => `
        <button class="card" type="button" data-id="${escapeHtml(u.userId)}">
          <div class="card-header">
            <div class="avatar">${escapeHtml(initials(u.name))}</div>
            <div>
              <div class="name">${escapeHtml(u.name)}</div>
              <div class="email">${escapeHtml(u.email)}</div>
              <div class="hint">${u.transactions?.length || 0} transaction(s) — click to view</div>
            </div>
          </div>
        </button>
      `).join("");
    }

    // =========================================================================
    // 6. RENDER: SINGLE USER DETAIL (list is hidden while this shows)
    // =========================================================================
    function renderDetail(user) {
      const txs = Array.isArray(user.transactions) ? user.transactions : [];
      detailContent.innerHTML = `
        <div class="detail-head">
          <div class="avatar lg">${escapeHtml(initials(user.name))}</div>
          <div>
            <div class="name">${escapeHtml(user.name)}</div>
            <div class="email">${escapeHtml(user.email)}</div>
            <div class="meta">User ID: ${escapeHtml(user.userId)}</div>
          </div>
        </div>
        <h2 class="section-title">Transactions (${txs.length})</h2>
        ${
          txs.length
            ? `<ul class="tx-list">${txs.map((t) => `
                <li class="tx">
                  <div class="tx-top">
                    <span class="tx-title">${escapeHtml(t.title)}</span>
                    <span class="tx-date">${formatDate(t.date)}</span>
                  </div>
                  <p class="tx-message">${escapeHtml(t.message)}</p>
                </li>`).join("")}</ul>`
            : `<div class="empty">No transactions for this user.</div>`
        }
      `;
    }

    // =========================================================================
    // 7. NAVIGATION (hash-based, back/forward and refresh all work)
    // =========================================================================
    function showList() {
      detailView.classList.add("hidden");
      listView.classList.remove("hidden");
      subtitle.textContent = "Click a user to see only that user's details.";
      document.title = "Users Directory";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showDetail(user) {
      renderDetail(user);
      listView.classList.add("hidden");
      detailView.classList.remove("hidden");
      subtitle.textContent = "Viewing a single user.";
      document.title = `${user.name} — Users Directory`;
      backBtn.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function route() {
      const match = window.location.hash.match(/^#\/user\/(.+)$/);
      if (match) {
        const user = findUser(decodeURIComponent(match[1]));
        if (user) { showDetail(user); return; }
        window.location.hash = ""; // unknown id -> back to list
      }
      showList();
    }

    // Card clicks -> navigate to the user's detail route
    grid.addEventListener("click", (e) => {
      const card = e.target.closest(".card");
      if (!card) return;
      window.location.hash = `#/user/${encodeURIComponent(card.dataset.id)}`;
    });

    // Back button uses real history so browser back stays in sync
    backBtn.addEventListener("click", () => {
      if (window.history.length > 1) window.history.back();
      else window.location.hash = "";
    });

    // Escape key closes the detail view
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !detailView.classList.contains("hidden")) backBtn.click();
    });

    searchInput.addEventListener("input", renderList);
    window.addEventListener("hashchange", route);

    // Initial paint
    renderList();
    route();
  </script>
</body>
</html>
