<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Saved Users — NovaTrade</title>
<style>
  :root{
    --bg:#0c1416; --surface:#131e21; --surface-2:#182629; --surface-3:#1e2d31;
    --fg:#eef6f2; --muted:#93a8a5; --primary:#4ef58f; --primary-dim:#2bd97a;
    --border:rgba(120,180,160,.18); --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; padding:40px 18px;
    background:
      radial-gradient(ellipse at top, rgba(78,245,143,.13), transparent 60%),
      var(--bg);
    color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Inter",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto}
  header{margin-bottom:26px}
  h1{margin:0 0 6px;font-size:1.9rem;letter-spacing:-.02em}
  h1 span{background:linear-gradient(135deg,var(--primary),#a6ffcf);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:0;color:var(--muted);font-size:.92rem}
  .toolbar{display:flex;gap:10px;margin:18px 0}
  input[type=search]{
    flex:1;padding:11px 14px;border-radius:10px;background:var(--surface-2);
    border:1px solid var(--border);color:var(--fg);font-size:.92rem;outline:none;
  }
  input[type=search]:focus{border-color:var(--primary)}
  .list{display:flex;flex-direction:column;gap:10px}
  .user{
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
    transition:border-color .25s ease, transform .25s ease, box-shadow .25s ease;
  }
  .user:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 12px 34px -18px rgba(78,245,143,.25)}
  .user.open{border-color:var(--primary);box-shadow:0 12px 34px -18px rgba(78,245,143,.25)}
  .row{
    display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;
    background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left;
  }
  .avatar{
    width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;
    font-weight:700;font-size:.9rem;color:#0c1416;
    background:linear-gradient(135deg,var(--primary),var(--primary-dim));
  }
  .meta{flex:1;min-width:0}
  .title{font-weight:600;letter-spacing:-.01em;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .subtitle{font-size:.82rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{color:var(--muted);transition:transform .3s ease}
  .user.open .chev{transform:rotate(180deg);color:var(--primary)}
  .details{
    max-height:0;overflow:hidden;
    transition:max-height .45s cubic-bezier(.4,0,.2,1), opacity .3s ease;
    opacity:0;
  }
  .user.open .details{max-height:1200px;opacity:1}
  .details-inner{padding:2px 18px 18px;border-top:1px solid var(--border);margin-top:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding-top:14px}
  .field{background:var(--surface-3);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .k{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:4px}
  .v{font-size:.92rem;word-break:break-word}
  .v pre{margin:0;font-size:.82rem;color:var(--fg);white-space:pre-wrap;word-break:break-word}
  .v ul{margin:0;padding-left:18px}
  .v li{margin:3px 0}
  .empty{
    text-align:center;padding:50px 20px;border:1px dashed var(--border);
    border-radius:var(--radius);color:var(--muted);background:var(--surface)
  }
  .empty b{color:var(--fg)}
  code{background:var(--surface-2);padding:2px 6px;border-radius:6px;color:var(--primary);font-size:.85em}
  .badge{
    display:inline-block;padding:2px 7px;border-radius:6px;font-size:.7rem;font-weight:600;
    background:rgba(78,245,143,.12);color:var(--primary);border:1px solid rgba(78,245,143,.25);
    text-transform:uppercase;letter-spacing:.04em;
  }
  .type-null{color:var(--muted);font-style:italic}
  .type-bool{color:var(--primary)}
  .type-num{color:#7ee8ff}
  .type-str{color:#f5f5f5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Saved <span>Users</span></h1>
    <p class="sub">Loaded from <code>localStorage.savedUsers</code> — click a user card to reveal all details.</p>
  </header>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search by any detail…" autocomplete="off" />
  </div>

  <div class="list" id="list"></div>
</div>

<script>
(function () {
  var list = document.getElementById('list');
  var search = document.getElementById('search');

  function loadUsers() {
    try {
      var raw = localStorage.getItem('savedUsers');
      if (!raw) return [];
      var data = JSON.parse(raw);
      if (Array.isArray(data)) return data;
      if (data && typeof data === 'object') {
        return Object.keys(data).map(function (k) {
          var v = data[k];
          return (v && typeof v === 'object') ? Object.assign({ username: k }, v) : { username: k, value: v };
        });
      }
      return [];
    } catch (e) {
      return [];
    }
  }

  var NAME_KEYS = ['name','Name','fullName','full_name','FullName','username','Username','userName','email','Email','user_id','UserId','userId','userID','UserID','id','Id','ID'];
  var SUBTITLE_KEYS = ['email','Email','user_id','UserId','userId','userID','UserID','id','Id','ID','phone','Phone'];
  var SENSITIVE = /^(password|pass|pwd|confirmpassword|token|secret|apikey|api_key|privatekey)$/i;

  function getValue(u, keys) {
    for (var i = 0; i < keys.length; i++) {
      if (u && Object.prototype.hasOwnProperty.call(u, keys[i])) {
        var v = u[keys[i]];
        if (v !== undefined && v !== null && v !== '') return { key: keys[i], value: v };
      }
    }
    return null;
  }

  function titleOf(u) {
    var found = getValue(u, NAME_KEYS);
    return found ? String(found.value) : 'Unknown User';
  }

  function subtitleOf(u) {
    var found = getValue(u, SUBTITLE_KEYS);
    if (!found) return null;
    return label(found.key) + ': ' + String(found.value);
  }

  function initials(name) {
    var s = String(name).trim();
    var parts = s.split(/\s+/).filter(function (p) { return p.length > 0; });
    if (parts.length > 1) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    return (s.slice(0, 2) || '#').toUpperCase();
  }

  function label(key) {
    return key.replace(/[_-]/g, ' ').replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  function typeClass(val) {
    if (val === null || val === undefined) return 'type-null';
    if (typeof val === 'boolean') return 'type-bool';
    if (typeof val === 'number') return 'type-num';
    return 'type-str';
  }

  function formatValue(val) {
    if (val === null || val === undefined) return '<span class="type-null">—</span>';
    if (typeof val === 'boolean') return '<span class="type-bool">' + (val ? 'Yes' : 'No') + '</span>';
    if (typeof val === 'number') return '<span class="type-num">' + val + '</span>';
    if (typeof val === 'string') return '<span class="type-str">' + escapeHtml(val) + '</span>';
    return null;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function renderField(key, val) {
    if (SENSITIVE.test(key)) return '';
    var html = '<div class="field"><span class="k">' + escapeHtml(label(key)) + '</span><div class="v">';
    if (Array.isArray(val)) {
      if (val.length === 0) {
        html += '<span class="type-null">Empty list</span>';
      } else {
        html += '<ul>';
        val.forEach(function (item) {
          html += '<li>' + formatValue(item);
          if (typeof item === 'object' && item !== null) {
            html += '<br><pre>' + escapeHtml(JSON.stringify(item, null, 2)) + '</pre>';
          }
          html += '</li>';
        });
        html += '</ul>';
      }
    } else if (typeof val === 'object' && val !== null) {
      html += '<pre>' + escapeHtml(JSON.stringify(val, null, 2)) + '</pre>';
    } else {
      html += formatValue(val);
    }
    html += '</div></div>';
    return html;
  }

  function matches(u, q) {
    if (!q) return true;
    q = q.toLowerCase();
    return Object.keys(u).some(function (key) {
      if (SENSITIVE.test(key)) return false;
      var val = u[key];
      if (val === null || val === undefined) return false;
      var s = typeof val === 'object' ? JSON.stringify(val) : String(val);
      return s.toLowerCase().indexOf(q) > -1;
    });
  }

  var users = loadUsers();

  function render(filter) {
    var q = (filter || '').toLowerCase();
    var shown = users.filter(function (u) { return matches(u, q); });

    if (!users.length) {
      list.innerHTML = '<div class="empty"><b>No saved users found.</b><br>Nothing stored under <code>savedUsers</code> in this browser.</div>';
      return;
    }
    if (!shown.length) {
      list.innerHTML = '<div class="empty">No users match <b>' + escapeHtml(filter || '') + '</b>.</div>';
      return;
    }

    list.innerHTML = '';
    shown.forEach(function (u, idx) {
      var title = titleOf(u);
      var sub = subtitleOf(u);

      var card = document.createElement('div');
      card.className = 'user';

      var btn = document.createElement('button');
      btn.className = 'row';
      btn.type = 'button';
      btn.setAttribute('aria-expanded', 'false');

      var meta = '<div class="meta"><div class="title">' + escapeHtml(title) + '</div>';
      if (sub) meta += '<div class="subtitle">' + escapeHtml(sub) + '</div>';
      meta += '</div>';

      btn.innerHTML =
        '<span class="avatar">' + escapeHtml(initials(title)) + '</span>' +
        meta +
        '<span class="chev">&#9662;</span>';

      var details = document.createElement('div');
      details.className = 'details';
      var inner = document.createElement('div');
      inner.className = 'details-inner';

      var grid = document.createElement('div');
      grid.className = 'grid';

      Object.keys(u).forEach(function (key) {
        if (SENSITIVE.test(key)) return;
        var fieldHtml = renderField(key, u[key]);
        if (fieldHtml) grid.innerHTML += fieldHtml;
      });

      if (!grid.children.length) {
        grid.innerHTML = '<div class="field"><span class="k">Info</span><div class="v">No additional details.</div></div>';
      }

      inner.appendChild(grid);
      details.appendChild(inner);
      card.appendChild(btn);
      card.appendChild(details);
      list.appendChild(card);

      btn.addEventListener('click', function () {
        var isOpen = card.classList.contains('open');
        // close others
        Array.prototype.forEach.call(list.querySelectorAll('.user.open'), function (el) {
          el.classList.remove('open');
          el.querySelector('.row').setAttribute('aria-expanded', 'false');
        });
        if (!isOpen) {
          card.classList.add('open');
          btn.setAttribute('aria-expanded', 'true');
        }
      });
    });
  }

  search.addEventListener('input', function () { render(search.value); });
  render('');
})();
</script>
</body>
</html>
